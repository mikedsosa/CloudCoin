name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore CloudCoin.sln
      - name: Build
        run: dotnet build CloudCoin.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test CloudCoin.sln --no-build --configuration Release --verbosity normal
